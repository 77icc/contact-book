<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通讯录 · Contact Book</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">☎</span>
      <h1>通讯录</h1>
      <span class="count" id="countLabel">共 0 位联系人</span>
    </div>
    <div class="tools">
      <input id="searchInput" class="search" type="search" placeholder="搜索姓名 / 手机号 / 邮箱" />
      <button id="favFilterBtn" class="btn ghost" type="button">只看收藏</button>
      <button id="importBtn" class="btn ghost" type="button">导入 Excel</button>
      <button id="exportBtn" class="btn ghost" type="button">导出 Excel</button>
      <button id="addBtn" class="btn primary" type="button">+ 新增联系人</button>
      <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
    </div>
  </header>

  <main class="content">
    <section class="list" id="contactList" aria-live="polite"></section>
    <section class="empty" id="emptyState" hidden>
      <p class="empty-title">还没有联系人</p>
      <p class="empty-tip">点击右上角“+ 新增联系人”，或从 Excel 导入</p>
    </section>
  </main>

  <div class="mask" id="mask" hidden>
    <form class="dialog" id="contactForm" autocomplete="off">
      <div class="dialog-head">
        <h2 id="dialogTitle">新增联系人</h2>
        <button class="icon-btn" type="button" id="closeBtn" aria-label="关闭">×</button>
      </div>

      <div class="field">
        <label for="nameInput">姓名 <em>*</em></label>
        <input id="nameInput" name="name" type="text" placeholder="例如：张三" required maxlength="20" />
      </div>

      <div class="field">
        <label for="phoneInput">手机号</label>
        <input id="phoneInput" name="phone" type="tel" placeholder="例如：13800138000" maxlength="20" />
      </div>

      <div class="field">
        <label for="emailInput">邮箱</label>
        <input id="emailInput" name="email" type="email" placeholder="例如：zhangsan@example.com" />
      </div>

      <div class="field">
        <label for="socialInput">社交账号</label>
        <input id="socialInput" name="social" type="text" placeholder="例如：微信 zhangsan_wx" />
      </div>

      <div class="field">
        <label for="addressInput">住址</label>
        <input id="addressInput" name="address" type="text" placeholder="例如：福建省福州市福州大学" />
      </div>

      <div class="field">
        <label for="noteInput">备注</label>
        <input id="noteInput" name="note" type="text" placeholder="例如：同组队友" maxlength="50" />
      </div>

      <label class="switch">
        <input id="favInput" name="favorite" type="checkbox" />
        <span>加入收藏</span>
      </label>

      <div class="dialog-foot">
        <button class="btn ghost" type="button" id="cancelBtn">取消</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
